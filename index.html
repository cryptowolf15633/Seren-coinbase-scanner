
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEREN | Coinbase Scanner</title>
<style>
  body {
    background: #09151d;
    color: #e7f7f7;
    font-family: system-ui, sans-serif;
    padding: 24px;
    max-width: 700px;
    margin: auto;
  }
  h1 { color: #00f0e8; margin-bottom: 4px; }
  h2 { color: #00f0e8; font-size: 19px; }
  button {
    background: #00f0e8;
    color: #09151d;
    border: 0;
    border-radius: 8px;
    padding: 14px 18px;
    font-weight: bold;
    font-size: 16px;
    margin: 8px 8px 8px 0;
    cursor: pointer;
  }
  section {
    border: 1px solid #26424a;
    border-radius: 12px;
    padding: 16px;
    margin-top: 20px;
  }
  .status { margin: 14px 0; }
  li { padding: 4px; }
  .muted { color: #a9c4c8; }
</style>
</head>
<body>

<h1>SEREN</h1>
<p class="muted">Coinbase USD Market Scanner</p>

<section>
  <h2>Market Discovery</h2>
  <button id="scan">Scan Coinbase USD Pairs</button>
  <div id="status" class="status">Ready to scan.</div>
  <ul id="results"></ul>
</section>

<section>
  <h2>BTC-USD Candle Test</h2>
  <p class="muted">
    Builds completed 30-minute candles from Coinbase
    15-minute historical data.
  </p>
  <button id="candles">Test BTC Candles</button>
  <div id="candleStatus" class="status">
    Ready to retrieve candles.
  </div>
  <div id="candleResults"></div>
</section>

<script>
const API = "https://api.exchange.coinbase.com";

document.getElementById("scan").onclick = async () => {
  const status = document.getElementById("status");
  const results = document.getElementById("results");

  status.textContent = "Connecting to Coinbase...";
  results.replaceChildren();

  try {
    const response = await fetch(
      API + "/products",
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const products = await response.json();

    const usdPairs = products.filter(p =>
      p.quote_currency === "USD" &&
      p.status === "online" &&
      !p.trading_disabled &&
      !p.cancel_only &&
      !p.limit_only &&
      !p.auction_mode
    );

    usdPairs.sort((a, b) =>
      a.id.localeCompare(b.id)
    );

    status.textContent =
      "Found " + usdPairs.length +
      " active USD trading pairs.";

    for (const pair of usdPairs) {
      const li = document.createElement("li");
      li.textContent = pair.id;
      results.appendChild(li);
    }

  } catch (error) {
    status.textContent =
      "TEST FAILED: " + error.message;
  }
};

document.getElementById("candles").onclick = async () => {
  const status = document.getElementById("candleStatus");
  const results = document.getElementById("candleResults");

  status.textContent = "Retrieving BTC-USD candles...";
  results.replaceChildren();

  try {
    const response = await fetch(
      API + "/products/BTC-USD/candles?granularity=900",
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const raw = await response.json();

    if (!Array.isArray(raw)) {
      throw new Error("Unexpected candle response");
    }

    const now = Math.floor(Date.now() / 1000);
    const completed15 = raw
      .filter(c =>
        Array.isArray(c) &&
        c.length >= 6 &&
        c[0] + 900 <= now &&
        c.slice(0, 6).every(Number.isFinite)
      )
      .sort((a, b) => a[0] - b[0]);

    const byTime = new Map(
      completed15.map(c => [c[0], c])
    );

    const candles30 = [];

    for (const [time, first] of byTime) {
      if (time % 1800 !== 0) continue;

      const second = byTime.get(time + 900);
      if (!second) continue;
      if (time + 1800 > now) continue;

      candles30.push({
        time,
        low: Math.min(first[1], second[1]),
        high: Math.max(first[2], second[2]),
        open: first[3],
        close: second[4],
        volume: first[5] + second[5]
      });
    }

    candles30.sort((a, b) => a.time - b.time);

    if (!candles30.length) {
      throw new Error("No complete 30-minute candles found");
    }

    const latest = candles30[candles30.length - 1];

    status.textContent =
      "SUCCESS: Built " + candles30.length +
      " completed 30-minute candles.";

    const details = [
      ["Market", "BTC-USD"],
      ["Candle start",
        new Date(latest.time * 1000).toLocaleString()],
      ["Open", "$" + latest.open.toLocaleString()],
      ["High", "$" + latest.high.toLocaleString()],
      ["Low", "$" + latest.low.toLocaleString()],
      ["Close", "$" + latest.close.toLocaleString()],
      ["Volume", latest.volume.toFixed(4) + " BTC"]
    ];

    for (const [label, value] of details) {
      const p = document.createElement("p");
      const strong = document.createElement("strong");
      strong.textContent = label + ": ";
      p.append(strong, document.createTextNode(value));
      results.appendChild(p);
    }

  } catch (error) {
    status.textContent =
      "TEST FAILED: " + error.message;
  }
};
</script>
</body>
</html>
