
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Seren | Coinbase Scanner</title>
  <style>
    body {
      background: #09151d;
      color: #e7f7f7;
      font-family: system-ui, sans-serif;
      padding: 24px;
      max-width: 700px;
      margin: auto;
    }
    h1 { color: #00f0e8; }
    button {
      background: #00f0e8;
      color: #09151d;
      border: 0;
      border-radius: 8px;
      padding: 14px 20px;
      font-weight: bold;
      font-size: 16px;
    }
    #status { margin: 20px 0; }
    li { padding: 5px; }
  </style>
</head>
<body>
  <h1>SEREN</h1>
  <p>Coinbase USD Market Scanner</p>

  <button id="scan">Scan Coinbase</button>
  <div id="status">Ready to test.</div>
  <ul id="results"></ul>

  <script>
    document.getElementById("scan").onclick =
      async function () {
        const status = document.getElementById("status");
        const results = document.getElementById("results");

        status.textContent = "Connecting to Coinbase...";
        results.replaceChildren();

        try {
          const response = await fetch(
            "https://api.exchange.coinbase.com/products",
            { cache: "no-store" }
          );

          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }

          const products = await response.json();

          const usdPairs = products.filter(p =>
            p.quote_currency === "USD" &&
            p.status === "online" &&
            !p.trading_disabled &&
            !p.cancel_only &&
            !p.limit_only &&
            !p.auction_mode
          );

          usdPairs.sort((a, b) =>
            a.id.localeCompare(b.id)
          );

          status.textContent =
            "Found " + usdPairs.length +
            " active USD trading pairs.";

          for (const pair of usdPairs) {
            const li = document.createElement("li");
            li.textContent = pair.id;
            results.appendChild(li);
          }

        } catch (error) {
          status.textContent =
            "TEST FAILED: " + error.message;
        }
      };
  </script>
</body>
</html>
